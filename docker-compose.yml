services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: selada-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - GIN_MODE=release
      - ALLOWED_ORIGINS=*
      - TZ=Asia/Jakarta
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - selada-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: selada-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - NITRO_PORT=3001
      - NITRO_HOST=0.0.0.0
      - NUXT_PUBLIC_API_BASE=/api
      - NUXT_API_PROXY_TARGET=http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - selada-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3001 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  
  nginx:
    image: nginx:alpine
    container_name: selada-nginx
    restart: unless-stopped
    ports:
      - "8023:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - selada-network

networks:
  selada-network:
    driver: bridge
